name: Build and Release

on:
  push:
    branches:
      - main

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false

  build:
    needs: tag
    if: needs.tag.outputs.new_tag
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Inject version from tag
        run: node scripts/inject-version.js ${{ needs.tag.outputs.new_tag }}

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Bundle with esbuild
        run: npm run bundle

      - name: Package executable
        run: npx @yao-pkg/pkg dist/bundle.cjs --targets node20-win-x64 --output build/print-agent.exe --config package.json

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.new_tag }}
          files: build/print-agent.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
